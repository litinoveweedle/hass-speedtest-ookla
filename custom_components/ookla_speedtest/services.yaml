run_speedtest:
  name: Run Speedtest
  description: Manually trigger one or all configured Ookla Speedtest runs.
  fields:
    config_entry_id:
      name: Config Entry
      description: Optional Ookla Speedtest config entry to run only that configured test. If omitted, all configured tests are run.
      selector:
        config_entry:
          integration: ookla_speedtest

register_card_resources:
  name: Register Card Resources
  description: >
    Automatically register Ookla Speedtest card resources in all Lovelace dashboards.
    Run this service once after installation, then refresh your browser.
    Cards will be available in the "Add Card" picker.
  fields: {}
